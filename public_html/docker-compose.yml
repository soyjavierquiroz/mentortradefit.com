services:
  traderfit_app:
    image: traderfit:latest
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - traefik_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_public
        - traefik.http.services.traderfit_app.loadbalancer.server.port=80
        - traefik.http.routers.traderfit_app.rule=Host(`traderfit.kurukin.com`)
        - traefik.http.routers.traderfit_app.entrypoints=websecure
        - traefik.http.routers.traderfit_app.tls=true
        - traefik.http.routers.traderfit_app.tls.certresolver=myresolver

networks:
  traefik_public:
    external: true
